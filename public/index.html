<!doctype html>
<html lang="cs">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>Hodnocení</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700;800&family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
<div class="wrap">
  <div class="logo-area">
    <h1>Vaše hodnocení</h1>
    <p>Sdílejte svůj zážitek a pomozte nám se zlepšovat</p>
  </div>

  <div class="card">
    <div class="stars-label">Celkové hodnocení</div>
    <div class="stars-row" id="mainStars" role="radiogroup" aria-label="Celkové hodnocení">
      <label data-val="1" title="1 hvězdička">★<input type="radio" name="overall" value="1"/></label>
      <label data-val="2" title="2 hvězdičky">★<input type="radio" name="overall" value="2"/></label>
      <label data-val="3" title="3 hvězdičky">★<input type="radio" name="overall" value="3"/></label>
      <label data-val="4" title="4 hvězdičky">★<input type="radio" name="overall" value="4"/></label>
      <label data-val="5" title="5 hvězdiček">★<input type="radio" name="overall" value="5"/></label>
    </div>
    <div class="star-hint" id="mainHint">Klikněte pro výběr hodnocení</div>

    <div class="field">
      <label for="email">Váš email (nepovinné)</label>
      <input type="email" id="email" placeholder="jmeno@email.cz" autocomplete="email"/>
    </div>

    <div class="field">
      <label for="message">Vaše recenze</label>
      <textarea id="message" placeholder="Napište nám, jak jste byli spokojeni..."></textarea>
    </div>

    <button class="btn-submit" id="submitBtn" type="button">Odeslat hodnocení</button>
    <div class="error-msg" id="errorMsg"></div>
  </div>
</div>

<!-- Thank you modal -->
<div class="modal-overlay" id="modalOverlay" role="dialog" aria-modal="true">
  <div class="modal">
    <h2 id="modalTitle">Děkujeme!</h2>
    <p id="modalText">Vaše hodnocení bylo úspěšně odesláno. Velmi si vážíme vaší zpětné vazby.</p>
    <div class="modal-btns" id="modalBtns"></div>
  </div>
</div>

<script>
const HINTS = ['','Velmi zklamáni','Mohlo být lepší','Průměr','Dobré hodnocení','Výborně!'];
const GOOGLE_MAPS_URL = 'https://maps.google.com/?q=VaseProvozovna'; // ← změňte na váš odkaz

function setupStars(container, onSelect) {
  const labels = container.querySelectorAll('label');
  labels.forEach(lbl => {
    lbl.addEventListener('mouseenter', () => highlight(labels, +lbl.dataset.val));
    lbl.addEventListener('mouseleave', () => {
      const checked = container.querySelector('input:checked');
      highlight(labels, checked ? +checked.value : 0);
    });
    lbl.addEventListener('click', () => {
      highlight(labels, +lbl.dataset.val);
      if (onSelect) onSelect(+lbl.dataset.val);
    });
  });
}

function highlight(labels, val) {
  labels.forEach(l => {
    l.classList.toggle('active', +l.dataset.val <= val);
  });
}

let overallVal = 0;

setupStars(document.getElementById('mainStars'), v => {
  overallVal = v;
  const hint = document.getElementById('mainHint');
  hint.textContent = HINTS[v] || '';
  hint.className = 'star-hint' + (v ? ' filled' : '');
});

// Submit
document.getElementById('submitBtn').addEventListener('click', async () => {
  const err = document.getElementById('errorMsg');
  err.textContent = '';

  if (!overallVal) {
    err.textContent = 'Prosím vyberte celkové hodnocení hvězdičkami.';
    return;
  }

  const payload = {
    overall_stars: overallVal,
    email: document.getElementById('email').value.trim() || null,
    message: document.getElementById('message').value.trim() || null,
  };

  const btn = document.getElementById('submitBtn');
  btn.disabled = true;
  btn.innerHTML = '<span class="spinner"></span>Odesílám...';

  try {
    const res = await fetch('/api/reviews', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(payload),
    });
    const data = await res.json();
    if (!data.ok) throw new Error(data.error);
    showModal(overallVal >= 4);
  } catch (e) {
    err.textContent = 'Chyba při odesílání: ' + (e.message || 'Zkuste to prosím znovu.');
    btn.disabled = false;
    btn.textContent = 'Odeslat hodnocení';
  }
});

function showModal(isPositive) {
  const overlay = document.getElementById('modalOverlay');
  document.getElementById('modalTitle').textContent = isPositive ? 'Skvělé, děkujeme!' : 'Děkujeme za zpětnou vazbu';
  document.getElementById('modalText').textContent = isPositive
    ? 'Moc si vážíme vašeho hodnocení! Pokud chcete, podpořte nás recenzí i na Google Mapách — pomůže nám to.'
    : 'Vaše hodnocení jsme obdrželi a budeme se jím zabývat. Omlouváme se za jakékoli nedostatky.';

  const btns = document.getElementById('modalBtns');
  btns.innerHTML = '';

  if (isPositive) {
    const a = document.createElement('a');
    a.href = GOOGLE_MAPS_URL;
    a.target = '_blank';
    a.rel = 'noopener';
    a.className = 'btn-google';
    a.textContent = '★ Ohodnotit na Google Mapách';
    btns.appendChild(a);
  }

  const close = document.createElement('button');
  close.className = 'btn-close';
  close.textContent = 'Zavřít';
  close.addEventListener('click', () => {
    overlay.classList.remove('show');
    // Reset form
    setTimeout(() => location.reload(), 350);
  });
  btns.appendChild(close);

  overlay.classList.add('show');
}

// Close on overlay click
document.getElementById('modalOverlay').addEventListener('click', e => {
  if (e.target === e.currentTarget) {
    e.currentTarget.classList.remove('show');
    setTimeout(() => location.reload(), 350);
  }
});
</script>
</body>
</html>
