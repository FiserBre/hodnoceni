<!doctype html>
<html lang="cs">
    <head>
        <meta charset="utf-8"/>
        <meta name="viewport" content="width=device-width,initial-scale=1"/>
        <title>Správa hodnocení</title>
        <link rel="preconnect" href="https://fonts.googleapis.com"/>
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
        <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=DM+Sans:wght@300;400;500&family=DM+Mono:wght@400&display=swap" rel="stylesheet"/>
        <link rel="stylesheet" href="css/admin.css">
    </head>
    <body>
        <div id="loginScreen">
            <div class="login-box">
                <input type="password" class="login-input" id="tokenInput" placeholder="Heslo" autocomplete="current-password"/>
                <button class="btn-login" id="loginBtn">Přihlásit se</button>
                <div class="login-err" id="loginErr">
                </div>
            </div>
        </div>
        <div id="app">
            <header class="topbar">
                <div style="display:flex;gap:0.75rem;align-items:center">
                    <a href="index.html" style="color:var(--text-muted);font-size:0.82rem;text-decoration:none;opacity:0.7">← Formulář</a>
                    <button class="btn-logout" id="logoutBtn">Odhlásit</button>
                </div>
            </header>
            <div class="container">
                <div class="stats-grid" id="statsGrid">
                    <div class="stat-card">
                        <div class="stat-label">Celkem recenzí</div>
                        <div class="stat-value" id="sTotal">—</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-label">Průměr hvězdiček</div>
                        <div class="stat-value gold" id="sAvg">—</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-label">Negativních</div>
                        <div class="stat-value red" id="sNeg">—</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-label">5 hvězdiček</div>
                        <div class="stat-value green" id="sFive">—</div>
                    </div>
                </div>
                <div class="toolbar">
                    <button class="filter-btn active" data-filter="all">Všechny</button>
                    <button class="filter-btn" data-filter="positive">Pozitivní (4–5★)</button>
                    <button class="filter-btn" data-filter="negative">Negativní (&lt;4★)</button>
                    <div class="toolbar-spacer">
                    </div>
                    <button class="refresh-btn" id="refreshBtn">↻ Obnovit</button>
                </div>
                <div class="table-wrap">
                    <div class="loading-state" id="loadingState">
                        <div class="spinner">
                        </div>
                        <p>Načítám hodnocení…</p>
                    </div>
                    <div id="emptyState" class="empty-state" style="display:none">
                        <p>Zatím žádná hodnocení.</p>
                    </div>
                    <table id="reviewsTable" style="display:none">
                        <thead>
                            <tr>
                                <th>#</th>
                                <th>Datum</th>
                                <th>Celkové</th>
                                <th>Email</th>
                                <th>Recenze</th>
                                <th>Status</th>
                                <th>
                                </th>
                            </tr>
                        </thead>
                        <tbody id="reviewsTbody">
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
        <div class="confirm-overlay" id="confirmOverlay">
            <div class="confirm-box">
                <h3>Smazat recenzi?</h3>
                <p>Tato akce je nevratná. Hodnocení bude trvale odstraněno.</p>
                <div class="confirm-btns">
                    <button class="btn-confirm-cancel" id="confirmCancel">Zrušit</button>
                    <button class="btn-confirm-del" id="confirmDel">Smazat</button>
                </div>
            </div>
        </div>
        <script src="scripts/admin.js" defer></script>
        <script src="scripts/admin.js" defer></script>
